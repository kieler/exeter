name: exeter-test

services:
  database:
    image: postgres:18.4-alpine3.23@sha256:96d56f7f57c6aacd1fcb908bc83b345ec5f83231ee486dd66a1baadce274db88
    restart: unless-stopped
    env_file:
      - ./apps/exeter-server/.env.test
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 1s
      timeout: 5s
      retries: 20
    networks:
      dev:
        aliases:
          - exeter-test-database

networks:
  dev:
    name: master-arbeit-dev
    external: true
